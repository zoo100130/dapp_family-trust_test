<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FamilyTrust · 信託控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
:root{
  --bg:#0f101a;--side:#0c0d16;--surface:#161826;--surface-2:#1d2033;--border:#272a3f;--text:#e6e8f2;--muted:#8b90a8;--faint:#5d6280;
  --primary:#98a4f7;--primary-weak:#98a4f71f;--on-primary:#0f101a;
  --success:#4fd18b;--warning:#f2b84b;--danger:#f27171;
  --s1:#3987e5;--s2:#d95926;--grid:#23263a;
  --sans:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f6f7fb;--side:#eef0f6;--surface:#fff;--surface-2:#f0f2f8;--border:#dcdfeb;--text:#141626;--muted:#5a5f78;--faint:#9a9fb5;
  --primary:#5664d9;--primary-weak:#5664d914;--on-primary:#fff;
  --success:#1f9d5c;--warning:#a86b00;--danger:#c93b3b;
  --s1:#2a78d6;--s2:#eb6834;--grid:#e9ebf2;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:600;font-size:15px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--primary);display:grid;place-items:center;color:var(--on-primary);font:600 12px var(--mono)}
.brand small{display:block;font:500 11px var(--sans);color:var(--muted)}
.trustsel{margin:0 12px 10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--text);font:inherit;text-align:left;width:calc(100% - 24px)}
.trustsel:hover{border-color:var(--faint)}
.trustsel b{display:block;font:500 12px var(--mono)}
.trustsel span{font-size:11px;color:var(--muted)}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav-g{font-size:12px;font-weight:500;color:var(--faint);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13.5px;text-decoration:none}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a[aria-current=page]{background:var(--primary-weak);color:var(--text)}
.nav a[aria-current=page] svg{color:var(--primary)}
.nav svg{width:16px;height:16px;flex:none}
.nav .tag{margin-left:auto;font-size:10px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:600;line-height:16px}
.nav .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.wallet{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;background:conic-gradient(from 90deg,var(--s1),var(--primary),var(--s2),var(--s1))}
.wallet b{display:block;font:500 12px var(--mono)}
.wallet span{font-size:11px;color:var(--muted)}
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:10}
.crumb{font-size:13px;color:var(--muted);margin-right:auto;display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--text);font-weight:500}
.page{padding:24px;max-width:1280px;width:100%}
.menu-btn{display:none!important}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .menu-btn{display:inline-flex!important}
  .topbar{padding:0 12px;gap:8px}.page{padding:16px}
}
@media (max-width:520px){#statusPill,#refreshBtn{display:none}.crumb span{display:none}}

/* ---------- atoms ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;line-height:20px}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.p-ok{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent);border-color:transparent}
.p-warn{color:var(--warning);background:color-mix(in srgb,var(--warning) 12%,transparent);border-color:transparent}
.p-bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:transparent}
.p-pri{color:var(--primary);background:var(--primary-weak);border-color:transparent}
.p-s2{color:var(--s2);background:color-mix(in srgb,var(--s2) 14%,transparent);border-color:transparent}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 13px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;justify-content:center}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:0 8px}
.btn.lg{height:44px;padding:0 22px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,.seg button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.eyebrow{font-size:12px;font-weight:500;color:var(--muted)}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0;max-width:70ch}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .note{margin:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.g{display:grid;gap:16px;margin-bottom:16px}
.g>*{min-width:0}
.g-21{grid-template-columns:2fr 1fr}.g-12{grid-template-columns:1fr 2fr}.g-11{grid-template-columns:1fr 1fr}.g-111{grid-template-columns:repeat(3,1fr)}
@media (max-width:1100px){.g-111{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.g-21,.g-12,.g-11,.g-111{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--border))}
.kpi b{display:block;white-space:nowrap;font:600 22px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin:6px 0 2px}
.kpi b small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .note{font-size:12px}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:18px}}
.note{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--success);border-radius:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning)}
.banner.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.banner.info{background:var(--primary-weak);color:var(--primary)}
.addr{font:12px var(--mono);color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}
ul.plain{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}

/* hero */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font:600 40px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.hero .big small{font-size:16px;color:var(--muted);font-weight:500;margin-left:6px}

/* table */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
tr:last-child td{border-bottom:0}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input{width:100%;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:0 10px;font:13px var(--mono)}
.quote{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.quote small{display:block;color:var(--muted);font-size:11px}
.quote b{font:600 15px var(--mono)}

/* periods */
.periods{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.side-grid .periods{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:520px){.periods{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cell{aspect-ratio:1.3;border-radius:6px;display:grid;place-items:center;font:500 12px var(--mono)}
.s-claimed{background:var(--surface-2);color:var(--faint)}
.s-due{background:var(--success);color:#0b1a12}
.s-due.blk{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger)}
.s-future{background:color-mix(in srgb,var(--s1) 20%,transparent);color:var(--s1)}
.s-listed{background:color-mix(in srgb,var(--s1) 10%,transparent);color:var(--warning);outline:1.5px dashed var(--warning);outline-offset:-1.5px}
.s-sold{background:color-mix(in srgb,var(--s2) 22%,transparent);color:var(--s2)}
.cell.mine{box-shadow:inset 0 0 0 2px var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.ln{height:2px;width:16px;border-radius:1px}

/* chart */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11px var(--mono);fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:150px;max-width:260px}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r span:first-child{display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.tip .r span:last-child{font-family:var(--mono)}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.stackbar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin:10px 0 12px}
.stackbar i{display:block;height:100%}

/* events */
.ev{list-style:none;margin:0;padding:0}
.ev li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center}
.ev li:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.y{color:var(--success)}.n{color:var(--faint)}.a{color:var(--warning)}

#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--bar,var(--primary));border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast code{font:11px var(--mono);display:block;margin-top:2px}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">FT</span><div>FamilyTrust<small>鏈上信託控制台</small></div></div>
    <button class="trustsel" id="trustSel" title="切換信託合約"><div><b id="tsAddr">尚未載入</b><span id="tsSub">Sepolia</span></div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9l4-4 4 4M16 15l-4 4-4-4"/></svg></button>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="wallet" id="walletBox"></div></div>
  </aside>
  <div class="mainc">
    <header class="topbar">
      <button class="btn ghost menu-btn" id="menuBtn" aria-label="選單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <span class="pill" id="statusPill"></span>
      <button class="btn ghost" id="refreshBtn" title="重新整理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
      <button class="btn pri" id="connectBtn">連接錢包</button>
    </header>
    <main class="page"><div id="banner"></div><div id="view"></div></main>
  </div>
</div>
<div id="toasts"></div>
<div class="tip" id="tip" hidden></div>

<script>
(function(){
"use strict";
const RPC="https://ethereum-sepolia-rpc.publicnode.com", CHAIN_HEX="0xaa36a7", CHAIN_ID=11155111n, SCAN="https://sepolia.etherscan.io";
const FAIR_APR=800;

const TRUST_ABI=[
 "function token() view returns (address)","function settlor() view returns (address)","function beneficiary() view returns (address)",
 "function startTime() view returns (uint256)","function interval() view returns (uint256)","function amountPerPeriod() view returns (uint256)",
 "function totalPeriods() view returns (uint256)","function claimed(uint256) view returns (bool)","function periodOwner(uint256) view returns (address)",
 "function unpaidLiabilities() view returns (uint256)","function coverageBps() view returns (uint256)",
 "function pausedUntil() view returns (uint256)","function pauseUsedPeriods() view returns (uint256)","function maxPausePeriods() view returns (uint256)","function pauseBudgetPeriods() view returns (uint256)",
 "function maxAprBps() view returns (uint256)","function periodsPerYear() view returns (uint256)","function pauseBudgetLeft() view returns (uint256)","function nextPayout() view returns (bool exists,uint256 periodId,uint256 time)",
 "function listingsCount() view returns (uint256)","function listings(uint256) view returns (uint256 fromId,uint256 toId,uint256 price,bool active,address buyer)",
 "function quote(uint256 fromId,uint256 toId,uint256 aprBps) view returns (uint256)","function impliedAprBps(uint256) view returns (uint256)","function listingDiscountBps(uint256) view returns (uint256)",
 "function fund(uint256 amountTokens)","function claim()","function pause(uint256 periods)","function unpause()",
 "function listPeriods(uint256 fromId,uint256 toId,uint256 priceTokens) returns (uint256)","function cancelListing(uint256)","function buy(uint256)",
 "error NotSettlor()","error NotBeneficiary()","error CannotBuyOwn()","error SettlorCannotBuy()","error InvalidParams()","error ZeroAmount()","error InvalidRange()",
 "error OverFunded()","error InsufficientFunds()","error NotFullyFunded()","error NothingToClaim()","error PeriodAlreadyDue()",
 "error PeriodNotOwned()","error AlreadyListed()","error PriceTooHigh()","error AprTooHigh()","error ListingNotActive()",
 "error TrustPaused()","error AlreadyPaused()","error NotPaused()","error PauseTooLong()","error PauseBudgetExceeded()",
 "error ReentrancyGuardReentrantCall()","error SafeERC20FailedOperation(address)",
 "error ERC20InsufficientAllowance(address,uint256,uint256)","error ERC20InsufficientBalance(address,uint256,uint256)"];
const ERC20_ABI=["function balanceOf(address) view returns (uint256)","function allowance(address,address) view returns (uint256)","function approve(address,uint256) returns (bool)","function decimals() view returns (uint8)","function symbol() view returns (string)"];
const ZH={NotSettlor:"只有出資人可以執行這個動作",NotBeneficiary:"只有受益人可以執行這個動作",CannotBuyOwn:"受益人不能承購自己的掛單",SettlorCannotBuy:"出資人不能承購（避免利益衝突）",
 InvalidParams:"部署參數不合法",ZeroAmount:"金額不能是 0",InvalidRange:"期數範圍不正確",OverFunded:"存入後會超過未付總額",InsufficientFunds:"信託餘額不足（要保留承購人的期數）",
 NotFullyFunded:"信託尚未存足，暫時不能掛單或承購",NothingToClaim:"目前沒有到期可領的期數",PeriodAlreadyDue:"第一期已到期，不能掛單或承購",PeriodNotOwned:"範圍內有期數已經賣出",
 AlreadyListed:"範圍內有期數已在其他掛單中",PriceTooHigh:"售價必須低於面額",AprTooHigh:"售價太低：隱含年化超過合約上限",ListingNotActive:"這張掛單已成交或已取消",
 TrustPaused:"出資人暫停中，受益人暫時不能領取或掛單",AlreadyPaused:"已經在暫停中",NotPaused:"目前沒有暫停",PauseTooLong:"超過單次暫停上限",PauseBudgetExceeded:"超過累計暫停額度",
 ReentrancyGuardReentrantCall:"重入保護觸發",SafeERC20FailedOperation:"代幣轉帳失敗",ERC20InsufficientAllowance:"授權額度不足",ERC20InsufficientBalance:"錢包代幣餘額不足"};
const EVENTS={
 "Funded(address,uint256)":{n:"存入",c:"var(--success)",k:"fund"},
 "Claimed(address,uint256,uint256)":{n:"領取",c:"var(--s1)",k:"claim"},
 "Listed(uint256,uint256,uint256,uint256)":{n:"掛單",c:"var(--warning)",k:"list"},
 "ListingCancelled(uint256)":{n:"取消掛單",c:"var(--faint)",k:"cancel"},
 "PeriodsSold(uint256,address,uint256)":{n:"承購成交",c:"var(--s2)",k:"sold"},
 "Paused(address,uint256)":{n:"暫停",c:"var(--danger)",k:"pause"},
 "Unpaused(address)":{n:"恢復",c:"var(--primary)",k:"unpause"}};
const EV_IFACE=new ethers.Interface(Object.keys(EVENTS).map(s=>"event "+s.replace(/\((.*)\)/,(m,a)=>"("+a.split(",").filter(Boolean).map((t,i)=>t+" a"+i).join(",")+")")));
const TOPIC={};Object.keys(EVENTS).forEach(s=>TOPIC[ethers.id(s)]=s);

 grid:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',

/* ---------- derive ---------- */
function derive(){
 const t=now(),P=S.total,due=t<S.start?0:Math.min(P,Math.floor((t-S.start)/S.interval));
 const listedIn=new Array(P).fill(-1);S.listings.forEach((l,i)=>{if(l.active)for(let k=l.fromId;k<=l.toId;k++)listedIn[k]=i;});
 const paused=t<S.pausedUntil,periods=[];
 for(let i=0;i<P;i++){const owner=S.owners[i],c=S.claimed[i],isDue=i<due;
  const st=c?"claimed":isDue?"due":listedIn[i]>=0?"listed":same(owner,S.beneficiary)?"future":"sold";
  periods.push({i,owner,claimed:c,due:isDue,st,listing:listedIn[i],dueAt:S.start+(i+1)*S.interval,ben:same(owner,S.beneficiary)});}
 const benDue=periods.filter(p=>p.due&&!p.claimed&&p.ben).length;
 const next=due<P?{i:due,at:S.start+(due+1)*S.interval}:null;
 const cnt=k=>periods.filter(p=>p.st===k).length;
 return {t,due,paused,periods,benDue,next,pauseLeft:Math.max(0,S.pauseBudget-S.pauseUsed),fullyFunded:S.balance>=S.unpaid,
  n:{claimed:cnt("claimed"),due:cnt("due"),future:cnt("future"),listed:cnt("listed"),sold:cnt("sold")},
  soldTotal:periods.filter(p=>!p.ben).length,soldUnclaimed:periods.filter(p=>!p.ben&&!p.claimed).length,
  deals:S.listings.filter(l=>!l.active&&l.buyer&&l.buyer!==ethers.ZeroAddress)};
}

   c.token(),c.settlor(),c.beneficiary(),c.startTime().catch(()=>null),c.interval(),c.amountPerPeriod(),c.totalPeriods(),c.unpaidLiabilities(),c.coverageBps(),
   c.pausedUntil(),c.pauseUsedPeriods().catch(()=>null),c.maxPausePeriods(),c.pauseBudgetPeriods().catch(()=>null),c.maxAprBps(),c.periodsPerYear().catch(()=>12n),c.listingsCount(),prov.getBlock("latest")]);

  let myBal=null;if(me)myBal=await erc.balanceOf(me);

  S={addr:trustAddr,token,symbol:sym,decimals:Number(dec),unit:10n**BigInt(dec),settlor,beneficiary,start:Number(startV),interval:Number(interval),amount,total:P,
   unpaid,cov:Number(cov),balance:bal,pausedUntil:Number(pausedUntil),pauseUsed:Number(usedV),maxPause:Number(maxPause),pauseBudget:Number(budgetV),
   maxApr:Number(maxApr),ppy:Number(ppy),claimed,owners,listings:ls,myBal,events:keep?S.events:[],evLoaded:keep?S.evLoaded:false};
  loading=false;render();loadEvents(prov);

async function loadEvents(prov){
 try{const head=await prov.getBlockNumber();let logs=[];
  for(const span of [9000,3000,1000]){try{logs=await prov.getLogs({address:trustAddr,fromBlock:Math.max(0,head-span),toBlock:head});break;}catch(e){}}
  const ev=logs.map(l=>{const sig=TOPIC[l.topics[0]];if(!sig)return null;let args=null;try{args=EV_IFACE.parseLog(l).args;}catch(e){}
   return {sig,args,block:l.blockNumber,tx:l.transactionHash};}).filter(Boolean).reverse();
  const blocks={};await Promise.all([...new Set(ev.slice(0,40).map(e=>e.block))].map(async b=>{try{blocks[b]=(await prov.getBlock(b)).timestamp;}catch(e){}}));
  ev.forEach(e=>e.ts=blocks[e.block]?Number(blocks[e.block]):null);
  if(S){S.events=ev;S.evLoaded=true;render();}
 }catch(e){console.warn("events",e);if(S){S.evLoaded=true;render();}}
}

const TIPS={};
function showTip(html,e){const t=$("#tip");t.innerHTML=html;t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;
 let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;t.style.left=x+"px";t.style.top=y+"px";}
const hideTip=()=>{$("#tip").hidden=true;};
function fitW(w){const avail=innerWidth-(innerWidth>960?300:70);return Math.round(Math.max(300,Math.min(w,avail)));}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
function lineChart(id,series,o){
 const W=fitW(o.w||720),H=o.h||240,L=52,R=16,T=14,B=28;
 const xs=series.flatMap(s=>s.pts.map(p=>p[0])),ys=series.flatMap(s=>s.pts.map(p=>p[1]));
 const x0=o.xmin!=null?o.xmin:Math.min(...xs),x1=o.xmax!=null?o.xmax:Math.max(...xs),y1=niceMax(Math.max(...ys,o.ymin||0)*1.05),y0=o.y0||0;
 const X=v=>L+(v-x0)/(x1-x0||1)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
 let g="";
 for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+o.yFmt(v)+'</text>';}
 (o.xticks||[x0,x1]).forEach(v=>{g+='<text x="'+X(v)+'" y="'+(H-8)+'" text-anchor="middle">'+o.xFmt(v)+'</text>';});
 if(o.band){g+='<rect x="'+X(o.band.x0)+'" y="'+T+'" width="'+Math.max(0,X(o.band.x1)-X(o.band.x0))+'" height="'+(H-T-B)+'" fill="var(--danger)" opacity=".08"/><text x="'+(X(o.band.x0)+6)+'" y="'+(T+14)+'" style="fill:var(--danger)">'+o.band.label+'</text>';}
 if(o.vline){g+='<line x1="'+X(o.vline.x)+'" x2="'+X(o.vline.x)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--primary)" stroke-dasharray="3 3"/><text x="'+(X(o.vline.x)+5)+'" y="'+(T+10)+'" style="fill:var(--primary)">'+o.vline.label+'</text>';}
 series.forEach(s=>{const d=s.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  if(s.area)g+='<path d="'+d+'L'+X(s.pts[s.pts.length-1][0])+' '+Y(0)+'L'+X(s.pts[0][0])+' '+Y(0)+'Z" fill="'+s.color+'" opacity=".12"/>';
  g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>';
  if(s.label){const lp=s.pts[s.pts.length-1];g+='<text x="'+(X(lp[0])-4)+'" y="'+(Y(lp[1])-8)+'" text-anchor="end" style="fill:var(--text)">'+esc(s.label)+'</text>';}});
 (o.marks||[]).forEach(m=>{g+='<circle cx="'+X(m.x)+'" cy="'+Y(m.y)+'" r="5" fill="'+m.color+'" stroke="var(--surface)" stroke-width="2"/>';});
 g+='<line id="'+id+'-cx" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>';
 series.forEach((s,i)=>{g+='<circle id="'+id+'-d'+i+'" r="4" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>';});
 g+='<rect class="hit" x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'"/>';
 TIPS[id]={kind:"line",series,o,X,Y,x0,x1,L,R,W};
 return '<div class="chart" data-chart="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||"")+'">'+g+'</svg></div>';
}
function barChart(id,bars,o){

 const bw=(W-L-R)/n,X=i=>L+i*bw,Y=v=>T+(1-v/y1)*(H-T-B);

 bars.forEach((b,i)=>{const x=X(i)+1,w=Math.max(2,bw-2),y=Y(b.v),h=Y(0)-y,r=Math.min(4,h,w/2);
  g+='<path d="M'+x+' '+Y(0)+'V'+(y+r)+'q0 -'+r+' '+r+' -'+r+'h'+(w-2*r)+'q'+r+' 0 '+r+' '+r+'V'+Y(0)+'Z" fill="'+(b.hatch?'url(#'+id+'-h)':b.color)+'" style="color:'+b.color+'"'+(b.hatch?' stroke="'+b.color+'" stroke-width="1" stroke-opacity=".6"':'')+'/>';

  g+='<rect class="hit" data-i="'+i+'" x="'+X(i)+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'"/>';});
 if(o.vline!=null){const x=X(o.vline);g+='<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--primary)" stroke-dasharray="3 3"/><text x="'+(x+5)+'" y="'+(T+10)+'" style="fill:var(--primary)">現在</text>';}

 renderChrome();const v=$("#view");
 if(!S&&page!=="settings"){v.innerHTML=vEmpty();$("#banner").innerHTML="";bindView(null);return;}
 const D=S?derive():null;
 $("#banner").innerHTML=!D?"":D.paused?'<div class="banner bad"><b>暫停中</b>出資人暫停了受益人撥款，'+dur(S.pausedUntil-D.t)+' 後自動恢復。承購人不受影響。</div>':
  (!D.fullyFunded?'<div class="banner warn"><b>尚未存足</b>信託餘額低於未付總額，暫時不能掛單或承購。</div>':(demo?'<div class="banner info">示範資料：數字是假的，按鈕不會送出交易。到「設定」載入真實合約。</div>':''));
 v.innerHTML=({overview:vOverview,settlor:vSettlor,beneficiary:vBeneficiary,buyer:vBuyer,cashflow:vCashflow,market:vMarket,ledger:vLedger,rules:vRules,settings:vSettings}[page]||vOverview)(D);
 bindView(D);
}
function bindView(D){
 document.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();nav(a.dataset.go);});
 const gd=$("#goDemo");if(gd)gd.onclick=startDemo;
 const cs=$("#cfgSave");if(cs){cs.onclick=()=>{if(setTrust($("#cfgAddr").value)){S=null;page="overview";load();}};$("#cfgAddr").onkeydown=e=>{if(e.key==="Enter")cs.click();};}
 const cd=$("#cfgDemo");if(cd)cd.onclick=startDemo;
 if(!D)return;
 document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id));
 document.querySelectorAll("#spanSeg [data-span]").forEach(b=>b.onclick=()=>{mkSpan=+b.dataset.span;render();});
 document.querySelectorAll("#ledSeg [data-f]").forEach(b=>b.onclick=()=>{ledFilter=b.dataset.f;render();});
 const g=$("#pgrid");if(g){g.onmousemove=e=>{const c=e.target.closest("[data-p]");if(!c){hideTip();return;}const p=D.periods[+c.dataset.p];
  showTip('<div class="t">第 '+p.i+' 期 · '+ST_N[p.st]+(p.listing>=0?" #"+p.listing:"")+'</div><div class="r"><span>到期</span><span>'+hm(p.dueAt)+'</span></div><div class="r"><span>擁有者</span><span>'+esc(who(p.owner))+'</span></div>',e);};g.onmouseleave=hideTip;}
 ["lsFrom","lsTo"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>quoteForm(D);});if($("#lsFrom"))quoteForm(D);
 bindCharts();
}
let qSeq=0;
async function quoteForm(D){
 const box=$("#quoteBox");if(!box)return;const f=+$("#lsFrom").value,t=+$("#lsTo").value,seq=++qSeq;
 if(!(t>=f)||f<D.due||t>=S.total){box.innerHTML='<div style="grid-column:1/-1;color:var(--warning)">範圍要在第 '+D.due+'–'+(S.total-1)+' 期之間，且起始期 ≤ 結束期</div>';return;}
 const n=t-f+1,face=S.amount*BigInt(n);let fair,floor;
 if(demo){const pv=r=>{let s=0;for(let j=0;j<n;j++)s+=tokN(S.amount)/(1+r/10000*((f+1-D.due)+j)/S.ppy);return BigInt(Math.round(s*1e6));};fair=pv(FAIR_APR);floor=pv(S.maxApr);}
 else{try{const c=new ethers.Contract(trustAddr,TRUST_ABI,wprov||rprov);[fair,floor]=await Promise.all([c.quote(f,t,FAIR_APR),c.quote(f,t,S.maxApr)]);}catch(e){box.innerHTML='<div style="grid-column:1/-1;color:var(--danger)">報價失敗：'+esc(errMsg(e))+'</div>';return;}}
 if(seq!==qSeq)return;const up=v=>Math.ceil(tokN(v));
 box.innerHTML='<div><small>面額（'+n+' 期）</small><b>'+tok(face,0)+'</b></div><div><small>合理價（8%）</small><b>'+up(fair).toLocaleString()+'</b></div><div><small>最低價（'+pct(S.maxApr)+'）</small><b>'+up(floor).toLocaleString()+'</b></div>';
 const p=$("#lsPrice");if(p&&!p.dataset.touched)p.value=up(fair);if(p)p.oninput=()=>p.dataset.touched="1";
}
async function act(key,id){
 const k=key.split(":")[0];
 if(k==="fund"){const v=Math.floor(+$("#fundAmt").value);if(!(v>0))return toast("請輸入金額","bad");return send(key,async c=>{await ensureAllowance(BigInt(v)*S.unit);return c.fund(BigInt(v));},"已存入 "+v+" "+S.symbol);}
 if(k==="claim"||k==="claimBuyer")return send(key,c=>c.claim(),"領取成功");
 if(k==="pause"){const n=+$("#pauseN").value;return send(key,c=>c.pause(n),"已暫停 "+n+" 期");}
 if(k==="unpause")return send(key,c=>c.unpause(),"已恢復撥款");
 if(k==="list"){const f=+$("#lsFrom").value,t=+$("#lsTo").value,p=Math.floor(+$("#lsPrice").value);if(!(p>0))return toast("請輸入售價","bad");return send(key,c=>c.listPeriods(f,t,p),"掛單成功：第 "+f+"–"+t+" 期");}
 if(k==="cancel")return send(key,c=>c.cancelListing(+id),"已取消掛單 #"+id);
 if(k==="buy"){const l=S.listings[+id];return send(key,async c=>{await ensureAllowance(l.price);return c.buy(+id);},"承購成功：第 "+l.fromId+"–"+l.toId+" 期");}
}

/* ---------- tick ---------- */
let lastDue=-1,rzT=null,lastW=innerWidth;
addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(Math.abs(innerWidth-lastW)>40&&S){lastW=innerWidth;render();}},200);});
setInterval(()=>{if(!S)return;document.querySelectorAll("[data-cd]").forEach(el=>el.textContent=dur(+el.dataset.cd-now()));const d=derive().due;if(lastDue>=0&&d!==lastDue)render();lastDue=d;},1000);
setInterval(()=>{if(!demo&&trustAddr&&!Object.values(busy).some(Boolean)&&document.visibilityState==="visible"&&!document.activeElement.matches("input"))load();},20000);

/* ---------- init ---------- */
function setTrust(a){a=(a||"").trim();if(!/^0x[0-9a-fA-F]{40}$/.test(a)){toast("地址格式不對：0x 開頭加 40 個英數字","bad");return false;}
 trustAddr=ethers.getAddress(a);demo=false;lsSet("ft_trust",trustAddr);const u=new URL(location.href);u.searchParams.set("trust",trustAddr);u.searchParams.delete("demo");u.hash="overview";history.replaceState(null,"",u);return true;}
function startDemo(){demo=true;const u=new URL(location.href);u.searchParams.set("demo","1");u.searchParams.delete("trust");history.replaceState(null,"",u);if(page==="settings")page="overview";load();}
$("#connectBtn").onclick=connect;$("#refreshBtn").onclick=()=>load();
$("#trustSel").onclick=()=>nav("settings");$("#menuBtn").onclick=e=>{e.stopPropagation();$("#app").classList.toggle("open");};
document.addEventListener("click",e=>{if($("#app").classList.contains("open")&&!e.target.closest(".side"))$("#app").classList.remove("open");});
rprov=new ethers.JsonRpcProvider(RPC,11155111,{staticNetwork:true});
const q=new URLSearchParams(location.search),h=location.hash.slice(1);
if(PAGES.some(p=>p.id===h))page=h;
if(q.get("demo"))demo=true;
else{const a=q.get("trust")||lsGet("ft_trust");if(a&&/^0x[0-9a-fA-F]{40}$/.test(a))trustAddr=ethers.getAddress(a);}
load();
})();
</script>
